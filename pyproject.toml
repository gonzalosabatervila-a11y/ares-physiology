[project]
name = "ares"
version = "0.1.0"
description = "ARES Physiology — Semana 0, Bootstrap v0.1"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "duckdb>=1.1",
    "keyring>=25",
    "structlog>=24",
    "python-dotenv>=1.0",
    "pytz>=2024.1",
    # Stack congelado; se usan a partir de `ares serve`
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "apscheduler>=3.10,<4",
]

[project.scripts]
ares = "ares.cli:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ares"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
