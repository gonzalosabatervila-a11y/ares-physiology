name: ARES tests

on:
  # No ejecutar CI tras cada commit de desarrollo; evita correos por estados intermedios.
  push:
    branches: [master]
  # Comprobar el PR cuando esté preparado para revisión, no mientras sea borrador.
  pull_request:
    types: [ready_for_review, reopened]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python 3.12 · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --python 3.12
      - name: Check browser JavaScript syntax
        run: node --check src/ares/app/static/app.js
      - name: Run tests (offline; no personal data or credentials)
        run: uv run pytest -q
