name: ARES tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python 3.12 · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --python 3.12
      - name: Check browser JavaScript syntax
        run: |
          node --check src/ares/app/static/app.js
          node --check src/ares/app/static/lab_ui.js
      - name: Run tests (offline; no personal data or credentials)
        run: uv run pytest -q
      - uses: docker/setup-buildx-action@v3
      - name: Build the container without publishing it
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: VCS_REF=${{ github.event.pull_request.head.sha || github.sha }}

  publish:
    if: github.event_name == 'push'
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          tags: ghcr.io/gonzalosabatervila-a11y/ares-physiology:sha-${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Attest the published digest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/gonzalosabatervila-a11y/ares-physiology
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
