name: ARES integration regression checks
on:
  pull_request:
    branches:
      - feature/ares-physiology-lab-20261013
  push:
    branches:
      - integration/gonzaloos-private-bridge-20261103
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Compile source
        run: uv run --frozen python -m compileall -q src
      - name: Check ARES browser scripts
        run: |
          node --check src/ares/app/static/app.js
          node --check src/ares/app/static/lab_ui.js
      - name: Run ARES regression tests
        run: uv run --frozen pytest -q
      - name: Build production container without tokens
        run: docker build -f Dockerfile.production -t ares-scientific:ci .
      - name: Verify production image contains Scientific Atelier
        run: |
          docker run --rm --network none --entrypoint python ares-scientific:ci -c "from ares.app.server import STATIC; assert (STATIC/'index.html').is_file(); assert (STATIC/'lab_ui.js').is_file(); print('Scientific Atelier production image OK')"
